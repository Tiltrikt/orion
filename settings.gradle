//file:noinspection GroovyAssignabilityCheck
pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name "GitLab"
            url "https://git.kpi.fei.tuke.sk/api/v4/projects/68034/packages/maven"
            credentials(HttpHeaderCredentials) {
                name = "Private-Token"
                value = System.getenv("KPI_GITLAB")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

rootProject.name = 'orion'

[
        "orion-common-event",
        "orion-common-kafka",

        "orion-service-domain",
        "orion-service-common",
        "orion-service-kafka-adapter",
        "orion-service-kafka-spring-boot-starter",

        "orion-client-domain",
        "orion-client-common",
        "orion-client-kafka-adapter",
        "orion-client-kafka-spring-boot-starter",

        "orion-example:fetch-registry-client",
        "orion-example:self-registration-client",
        "orion-example:api-gateway",
        "orion-example:orion-service"


].forEach {
    include it
}

rootProject.children.each { project ->
    {
        setProjectBuildFileName(project)
    }
}

void setProjectBuildFileName(project) {
    project.buildFileName = "${project.name}.gradle"
    project.children.each { subproject ->
        {
            setProjectBuildFileName(subproject)
        }
    }
}