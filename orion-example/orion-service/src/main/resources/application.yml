spring:
  application:
    name: orion-service

  kafka:
    producer:
      client-id: ${spring.application.name}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS}
      compression-type: gzip
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${spring.application.name}
      properties:
        spring.json.trusted.packages: "*"
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

orion:
  service:
    cluster-size: ${ORION_SERVICE_CLUSTER_SIZE}
    node-id: ${ORION_SERVICE_NODE_ID}

logging:
  level:
    root: error
    "dev.tiltrikt.orion": info